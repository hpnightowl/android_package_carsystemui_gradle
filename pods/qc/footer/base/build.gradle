plugins {
    id 'com.android.library'
}
apply from: rootProject.file('gradle/aosp-module.gradle')

android {
    namespace 'com.android.systemui.car.qc.footer.base'
    sourceSets.main {
        manifest.srcFile '../../../../pods/qc/footer/base/AndroidManifest.xml'
        java.srcDirs = ['../../../../pods/qc/footer/base/src']
        res.srcDirs = ['../../../../pods/qc/footer/base/res']
        assets.srcDirs = []
        aidl.srcDirs = []
    }
}

dependencies {
    api project(':CarSystemUI-Shared')
    api 'aosp:car-qc-lib:17'
    annotationProcessor files("${rootDir}/aosp-prebuilts/processors/dagger2-compiler.jar")
}
