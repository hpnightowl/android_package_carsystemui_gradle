plugins {
    id 'com.android.library'
}
apply from: rootProject.file('gradle/aosp-module.gradle')

android {
    namespace 'com.android.systemui.car.statusicon.mediavolume'
    sourceSets.main {
        manifest.srcFile '../../../pods/statusicon/mediavolume/AndroidManifest.xml'
        java.srcDirs = ['../../../pods/statusicon/mediavolume/src']
        res.srcDirs = ['../../../pods/statusicon/mediavolume/res']
        assets.srcDirs = []
        aidl.srcDirs = []
    }
}

dependencies {
    api project(':CarSystemUI-FlexibleUI')
    api project(':CarSystemUI-Shared')
    api project(':CarSystemUI-StatusIcon-Base')
    annotationProcessor files("${rootDir}/aosp-prebuilts/processors/dagger2-compiler.jar")
}
