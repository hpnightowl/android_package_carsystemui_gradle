plugins {
    id 'com.android.library'
    id 'com.android.legacy-kapt'
}
apply from: rootProject.file('gradle/aosp-module.gradle')

android {
    namespace 'com.android.systemui.car.systembar.privacy.cast'
    sourceSets.main {
        manifest.srcFile '../../../../pods/systembar/privacy/cast/AndroidManifest.xml'
        java.srcDirs = ['../../../../pods/systembar/privacy/cast/src']
        kotlin.srcDirs = ['../../../../pods/systembar/privacy/cast/src']
        res.srcDirs = ['../../../../pods/systembar/privacy/cast/res']
        assets.srcDirs = []
        aidl.srcDirs = []
    }
}

dependencies {
    api project(':CarSystemUI-FlexibleUI')
    api project(':CarSystemUI-Shared')
    api project(':CarSystemUI-SystemBar-Base-Controller')
    api project(':CarSystemUI-SystemBar-Base-View')
    api project(':CarSystemUI-SystemBar-PrivacyChip-Base')
    kapt files("${rootDir}/aosp-prebuilts/processors/dagger2-compiler.jar")
}
