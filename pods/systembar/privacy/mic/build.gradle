plugins {
    id 'com.android.library'
}
apply from: rootProject.file('gradle/aosp-module.gradle')

android {
    namespace 'com.android.systemui.car.systembar.privacy.mic'
    sourceSets.main {
        manifest.srcFile '../../../../pods/systembar/privacy/mic/AndroidManifest.xml'
        java.srcDirs = ['../../../../pods/systembar/privacy/mic/src/com/android/systemui/car/privacy/mic']
        res.srcDirs = ['../../../../pods/systembar/privacy/mic/res']
        assets.srcDirs = []
        aidl.srcDirs = []
    }
}

dependencies {
    api project(':CarSystemUI-FlexibleUI')
    api project(':CarSystemUI-QC-Base')
    api project(':CarSystemUI-QC-Footer-Base')
    api project(':CarSystemUI-Shared')
    api project(':CarSystemUI-SystemBar-Base-Controller')
    api project(':CarSystemUI-SystemBar-Base-View')
    api project(':CarSystemUI-SystemBar-PrivacyChip-Base')
    api project(':CarSystemUI-SystemBar-Panel')
    annotationProcessor files("${rootDir}/aosp-prebuilts/processors/dagger2-compiler.jar")
}
