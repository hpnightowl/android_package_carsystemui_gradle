plugins {
    id 'com.android.library'
    id 'com.android.legacy-kapt'
}
apply from: rootProject.file('gradle/aosp-module.gradle')

android {
    namespace 'com.android.systemui.car.systembar.split'
    sourceSets.main {
        manifest.srcFile '../../../pods/systembar/split/AndroidManifest.xml'
        java.srcDirs = ['../../../pods/systembar/split/src']
        kotlin.srcDirs = ['../../../pods/systembar/split/src']
        res.srcDirs = ['../../../pods/systembar/split/res']
        assets.srcDirs = []
        aidl.srcDirs = []
    }
}

dependencies {
    api project(':CarSystemUI-Shared')
    api project(':CarSystemUI-SystemBar-Base-Controller')
    api project(':CarSystemUI-SystemBar-Base-View')
    kapt files("${rootDir}/aosp-prebuilts/processors/dagger2-compiler.jar")
}
