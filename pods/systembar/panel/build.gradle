plugins {
    id 'com.android.library'
}
apply from: rootProject.file('gradle/aosp-module.gradle')

android {
    namespace 'com.android.systemui.car.systembar.panel'
    sourceSets.main {
        manifest.srcFile '../../../pods/systembar/panel/AndroidManifest.xml'
        java.srcDirs = ['../../../pods/systembar/panel/src']
        res.srcDirs = ['../../../pods/systembar/panel/res']
        assets.srcDirs = []
        aidl.srcDirs = []
    }
}

dependencies {
    api project(':CarSystemUI-FlexibleUI')
    api project(':CarSystemUI-QC-Base')
    api project(':CarSystemUI-Shared')
    api project(':CarSystemUI-SystemBar-Base-Controller')
    api project(':CarSystemUI-SystemBar-Base-View')
    annotationProcessor files("${rootDir}/aosp-prebuilts/processors/dagger2-compiler.jar")
}
