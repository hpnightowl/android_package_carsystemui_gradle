plugins {
    id 'com.android.library'
}
apply from: rootProject.file('gradle/aosp-module.gradle')

android {
    namespace 'com.android.systemui.car.notification'
    sourceSets.main {
        manifest.srcFile '../../pods/notification/AndroidManifest.xml'
        java.srcDirs = ['../../pods/notification/src']
        res.srcDirs = ['../../pods/notification/res']
        assets.srcDirs = []
        aidl.srcDirs = []
    }
}

dependencies {
    api project(':CarSystemUI-FlexibleUI')
    api project(':CarSystemUI-Shared')
    api project(':CarSystemUI-SystemBar-Base-Controller')
    api project(':CarSystemUI-SystemBar-Base-View')
    api 'aosp:CarNotificationLib:17'
    annotationProcessor files("${rootDir}/aosp-prebuilts/processors/dagger2-compiler.jar")
}
